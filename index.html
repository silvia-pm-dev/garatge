<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garatge compremelteucotxe.cat</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(#e28d1d, #bdb546);
        }
        div.contenidor {
            border-radius: 20px;
            margin: 50px;
            max-width: 550px;
            background: linear-gradient(#d4d4d2, #ececec);
        }
        div.interior {
            margin: 30px;
        }
        .afegir {
            background-color: rgb(192, 49, 39);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 8px;
            font-weight: bold;
            position: relative;
            top: -2px;
        }
        .afegir:hover {
            background-color: rgb(151, 39, 31);
        }
        :is(.afegir, .km, .delete):active {
            transform: scale(0.95);
        }
        h2 {
            font-family: Arial, Helvetica, sans-serif;
            color:rgb(129, 29, 4);
            font-size: 250%;
        }
        p {
            font-family: Arial, Helvetica, sans-serif;
        }
        .icona {
            position: relative;
            top: -4px;
        }
        input {
            padding: 10px 15px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        #cotxes {
            padding: 0;
        }
        #cotxes li {
            background-color: #f9f9f9;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 5px;
            list-style: none;
            font-family: Arial, Helvetica, sans-serif;
            width: 470px;
        }
        .km {
            background-color: rgb(195, 216, 5);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 6px 8px;
            font-weight: bold;
            margin-left: auto;
            margin-right: 10px;
        }
        .delete {
            background-color: rgb(235, 15, 162);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 6px 8px;
            font-weight: bold;
            
        }
        .km:hover {
            background-color: rgb(141, 155, 13);
        }
        .delete:hover {
            background-color: rgb(158, 12, 109);
        }
        .fila {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .info {
            width: 180px; /* Amplada fixa: cap preu començarà abans dels 250px */
            display: inline-block;
        }
        .preuVenta {
            width: 180px;
            margin-right: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="contenidor">
        <div class= "interior">
            <h2>Garatge compremelteucotxe.cat</h2>
            <p>Connexió: <span id="emote" class="icona">&#128078;</span><span id="connexio" style="color:red"> Sense connexió</span></p>
            <div>
                <input id="input" type="text" placeholder="Afegeix una matrícula">
                <button id="button" class="afegir">Envia</button>
            </div>
            <div>
                <ul id="cotxes">
                </ul>
            </div>
        </div>
    </div>
    <script src="ajax.js"></script>
</body>

</html>
